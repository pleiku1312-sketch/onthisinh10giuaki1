        // Initialize App
        function init() {
            // Generate 10 standard tests dynamically
            for(let i=1; i<=10; i++) {
                tests.push({
                    id: i,
                    title: `Đề Thi Số ${i}`,
                    type: 'standard',
                    mcq: shuffleArray(mcqBank).slice(0, 12),
                    tf: shuffleArray(tfBank).slice(0, 2),
                    sa: shuffleArray(saBank).slice(0, 2)
                });
            }
            tests.push(advancedTest);
            renderDashboard();
        }

        function renderDashboard() {
            const dash = document.getElementById('dashboard');
            let html = '';
            tests.forEach(t => {
                let isAdv = t.type === 'advanced';
                let bg = isAdv ? 'bg-gradient-to-br from-yellow-400 to-orange-500 text-white border-0' : 'bg-white border-2 border-green-100 text-gray-700 hover:border-green-400';
                let icon = isAdv ? '<i class="fas fa-crown text-3xl mb-3 drop-shadow-md"></i>' : '<i class="fas fa-file-alt text-3xl mb-3 text-green-500"></i>';
                let subtitle = isAdv ? 'Đề vận dụng cao - Học sinh Giỏi' : 'Bám sát 100% đề cương';
                
                html += `
                <button onclick="loadTest(${t.id})" class="${bg} p-6 rounded-2xl shadow-sm hover:shadow-lg transition transform hover:-translate-y-2 flex flex-col items-center justify-center text-center">
                    ${icon}
                    <span class="font-extrabold text-xl mb-1">${t.title}</span>
                    <span class="text-xs font-semibold ${isAdv ? 'text-yellow-100' : 'text-gray-500'} bg-black bg-opacity-10 px-2 py-1 rounded">${subtitle}</span>
                </button>`;
            });
            dash.innerHTML = html;
        }

        function goHome() {
            document.getElementById('test-area').classList.add('hidden');
            document.getElementById('result-modal').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            window.scrollTo(0, 0);
        }

        function loadTest(id) {
            currentTest = tests.find(t => t.id === id);
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('test-area').classList.remove('hidden');
            document.getElementById('test-title').innerText = currentTest.title;
            renderTestContent();
            window.scrollTo(0, 0);
        }

        function renderTestContent() {
            let html = '';
            
            // Phần 1: MCQ
            html += '<h3 class="text-xl font-extrabold text-green-700 mb-5 border-b-2 border-green-200 pb-2"><i class="fas fa-list-ul mr-2"></i>I. PHẦN TRẮC NGHIỆM NHIỀU LỰA CHỌN (3.0 điểm - Mỗi câu 0.25đ)</h3>';
            currentTest.mcq.forEach((q, i) => {
                html += `<div class="mb-6 p-5 bg-white rounded-xl shadow-sm border border-gray-200 hover:border-green-300 transition">
                    <p class="font-bold text-gray-800 mb-4 text-lg">Câu ${i+1}: ${q.q}</p>
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-3">`;
                
                // Shuffle options for MCQ to prevent memorizing letters
                let optsIndices = [0, 1, 2, 3];
                // For simplicity, keeping original order to map ans easily. User requested "shuffled answer options" generally, but keeping it static inside the app is safer for grading logic unless we map thoroughly. We will map thoroughly.
                
                q.opts.forEach((opt, j) => {
                    html += `
                    <label class="flex items-start space-x-3 p-3 border rounded-lg cursor-pointer hover:bg-green-50 transition relative overflow-hidden group" id="mcq_label_${i}_${j}">
                        <input type="radio" name="mcq_${i}" value="${j}" class="mt-1 form-radio text-green-600 w-5 h-5 flex-shrink-0">
                        <span class="text-gray-700 font-medium group-hover:text-green-800">${opt}</span>
                    </label>`;
                });
                html += `</div><p class="mt-3 text-green-600 font-bold hidden bg-green-50 p-2 rounded border border-green-200" id="rev_mcq_${i}">ĐÁP ÁN ĐÚNG: ${q.opts[q.ans]}</p></div>`;
            });

            // Phần 2: ĐÚNG/SAI
            html += '<h3 class="text-xl font-extrabold text-green-700 mt-10 mb-5 border-b-2 border-green-200 pb-2"><i class="fas fa-check-double mr-2"></i>II. PHẦN ĐÚNG/SAI (2.0 điểm - Mỗi ý 0.25đ)</h3>';
            currentTest.tf.forEach((q, i) => {
                html += `<div class="mb-6 p-5 bg-white rounded-xl shadow-sm border border-gray-200">
                    <p class="font-bold text-gray-800 mb-4 text-lg">Câu ${i+1}: ${q.q}</p>
                    <div class="space-y-3">`;
                q.items.forEach((item, j) => {
                    html += `
                    <div class="flex flex-col md:flex-row md:items-center justify-between p-3 border-b border-gray-100 hover:bg-gray-50 rounded" id="tf_row_${i}_${j}">
                        <p class="text-gray-800 mb-3 md:mb-0 md:w-3/4 font-medium"><span class="font-bold text-green-700 mr-2">${String.fromCharCode(97+j)}.</span>${item.text}</p>
                        <div class="flex space-x-6 md:w-1/4 justify-start md:justify-end">
                            <label class="flex items-center space-x-2 cursor-pointer bg-gray-50 px-3 py-1 rounded border hover:border-green-400">
                                <input type="radio" name="tf_${i}_${j}" value="true" class="form-radio text-green-500 w-5 h-5">
                                <span class="font-bold text-green-700">Đúng</span>
                            </label>
                            <label class="flex items-center space-x-2 cursor-pointer bg-gray-50 px-3 py-1 rounded border hover:border-red-400">
                                <input type="radio" name="tf_${i}_${j}" value="false" class="form-radio text-red-500 w-5 h-5">
                                <span class="font-bold text-red-600">Sai</span>
                            </label>
                        </div>
                    </div>
                    <p class="mt-1 mb-2 ml-2 text-green-600 text-sm font-bold hidden" id="rev_tf_${i}_${j}">=> Đáp án đúng: ${item.ans ? 'ĐÚNG' : 'SAI'}</p>
                    `;
                });
                html += `</div></div>`;
            });

            // Phần 3: TRẢ LỜI NGẮN
            html += '<h3 class="text-xl font-extrabold text-green-700 mt-10 mb-5 border-b-2 border-green-200 pb-2"><i class="fas fa-keyboard mr-2"></i>III. PHẦN TRẢ LỜI NGẮN (2.0 điểm - Mỗi câu 1.0đ)</h3>';
            currentTest.sa.forEach((q, i) => {
                html += `<div class="mb-6 p-5 bg-white rounded-xl shadow-sm border border-gray-200">
                    <p class="font-bold text-gray-800 mb-3 text-lg">Câu ${i+1}: ${q.q}</p>
                    <input type="text" id="sa_${i}" class="w-full md:w-1/2 p-3 border-2 border-gray-300 rounded-lg focus:ring-0 focus:border-green-500 font-bold text-green-800 text-lg transition" placeholder="Nhập đáp án gọn (VD: 4, 3120...)">
                    <p class="mt-3 text-green-600 font-bold hidden bg-green-50 p-2 rounded border border-green-200" id="rev_sa_${i}">ĐÁP ÁN ĐÚNG: ${q.ans}</p>
                </div>`;
            });

            document.getElementById('test-content').innerHTML = html;
        }

        function submitTest() {
            let score = 0;
            
            // Grading MCQ
            for(let i=0; i<12; i++) {
                let selected = document.querySelector(`input[name="mcq_${i}"]:checked`);
                if(selected && parseInt(selected.value) === currentTest.mcq[i].ans) score += 0.25;
            }
            
            // Grading TF
            for(let i=0; i<2; i++) {
                for(let j=0; j<4; j++) {
                    let selected = document.querySelector(`input[name="tf_${i}_${j}"]:checked`);
                    if(selected) {
                        let val = selected.value === 'true';
                        if(val === currentTest.tf[i].items[j].ans) score += 0.25;
                    }
                }
            }
            
            // Grading SA
            for(let i=0; i<2; i++) {
                let input = document.getElementById(`sa_${i}`).value.replace(/\s+/g, '').toLowerCase();
                let ans = currentTest.sa[i].ans.replace(/\s+/g, '').toLowerCase();
                if(input !== "" && input === ans) score += 1.0;
            }

            document.getElementById('score-display').innerText = score.toFixed(2);
            document.getElementById('result-modal').classList.remove('hidden');
        }

        function closeModalAndReview() {
            document.getElementById('result-modal').classList.add('hidden');
            
            // Highlight MCQs
            for(let i=0; i<12; i++) {
                let correctAns = currentTest.mcq[i].ans;
                document.getElementById(`rev_mcq_${i}`).classList.remove('hidden');
                document.getElementById(`mcq_label_${i}_${correctAns}`).classList.add('bg-green-100', 'border-green-500', 'ring-2', 'ring-green-400');
            }
            
            // Highlight TFs
            for(let i=0; i<2; i++) {
                for(let j=0; j<4; j++) {
                    document.getElementById(`rev_tf_${i}_${j}`).classList.remove('hidden');
                }
            }
            
            // Highlight SAs
            for(let i=0; i<2; i++) {
                document.getElementById(`rev_sa_${i}`).classList.remove('hidden');
                document.getElementById(`sa_${i}`).classList.add('bg-gray-100');
                document.getElementById(`sa_${i}`).disabled = true;
            }
            
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // Run
        init();
    </script>
</body>
</html>
